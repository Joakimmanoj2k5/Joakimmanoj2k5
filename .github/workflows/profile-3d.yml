name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Remove footer stats/icons from SVG
        run: |
          for f in profile-3d-contrib/*.svg; do
            perl -0777 -i -pe 's#<g><text style="font-size: 32px; font-weight: bold;".*?</g></svg>#</svg>#s' "$f"
          done

      - name: Commit and push generated SVG files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contribution graph"
          file_pattern: profile-3d-contrib/*.svg